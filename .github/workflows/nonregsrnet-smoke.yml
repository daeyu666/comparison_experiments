name: NonRegSRNet CPU checks
on:
  push:
    branches: [main, codex/nonregsrnet-reproduction]
    paths:
      - 'comparison/NonRegSRNet/**'
      - 'tests/test_nonregsrnet.py'
      - 'experiment_protocol.py'
      - 'test*.py'
      - '.github/workflows/nonregsrnet-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      NONREG_TEST_OFFICIAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'numpy<2' scipy h5py pytest tqdm
      - run: python -m pytest -q -p no:cacheprovider tests/test_nonregsrnet.py
      - run: python comparison/NonRegSRNet/smoke_test.py --device cpu
