name: Traditional Registered fusion
on:
  push:
    branches: [main, codex/traditional-registered]
    paths:
      - 'comparison/CNMF/**'
      - 'comparison/HySure/**'
      - 'comparison/traditional/**'
      - 'tests/test_traditional_registered.py'
      - 'experiment_protocol.py'
      - 'test.py'
      - '.github/workflows/traditional-registered-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'numpy<2' scipy pandas h5py pillow tifffile pytest threadpoolctl 'cvxpy==1.5.3'
      - run: CLASSICAL_TEST_OFFICIAL=1 python -m pytest -q tests/test_traditional_registered.py
      - run: python comparison/traditional/smoke_test.py --full

