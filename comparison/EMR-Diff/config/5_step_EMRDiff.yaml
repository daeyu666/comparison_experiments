diffusion:
  params:
    sf: 4
    schedule_name: exponential
    schedule_kwargs:
      power: 0.3
    etas_end: 0.999
    steps: 5
    min_noise_level: 0.001
    kappa: 2.0
    band_dim: 0
    normalize_input: False
    latent_flag: None

model:
  params:
    image_size: 64
    in_channels: 0
    model_channels: 0
    out_channels: 0
    channel_mult: [1,1,1,1,1]
    num_res_blocks: [1,1,1,1,1]
    dims: 2
    lqrgb_channels: 0
    rgb_channels: 0

data:
  dataset: PaviaU
  data_root: ../../data/raw
  patch_size: 64
  stride: 32
  validation_size: 128
  test_size: 128

  # Shared comparison degradation switch.
  degradation_mode: gaussian_bicubic
  degradation_sigma: 2.0
  degradation_kernel_size: 5
  mtf_nyquist: 0.2
  psf_truncate: 3.0

  # Shared MSI protocol is resolved by dataset:
  # PaviaU -> IKONOS4; Houston13/Chikusei -> WV2 all8.
  msi_mode: srf
  srf_band_set: auto

train:
  lr: 1e-4
  batch: [1,1]
  num_workers: 0
  microbatch: 1

  # Maximum training budget. Early stopping normally terminates before this.
  epochs: 3000

  # Dataset-aware validation cadence. Large datasets use shorter epoch intervals
  # because each epoch is much more expensive.
  validation_interval_by_dataset:
    PaviaU: 20
    Houston13: 10
    Chikusei: 5

  # Leakage-free early stopping on the independent validation region.
  early_stop_metric: PSNR
  early_stop_min_delta: 0.02
  early_stop_patience: 2
  eval_seed: 1234

  device: cuda
